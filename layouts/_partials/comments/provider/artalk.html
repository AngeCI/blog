{{- with .Site.Params.comments.artalk -}}
<link href="//{{ .server }}/dist/Artalk.css" rel="stylesheet" />
<script src="//{{ .server }}/dist/Artalk.js"></script>
<div id="artalk-comments"></div>
<script>
"use strict";
const isDarkMode = document.documentElement.getAttribute("data-scheme") === "dark";
const locale = {{ .Site.Language.LanguageCode }};
cpont isEnglish = locale === "en";
const artalk = Artalk.init({
  el:        "#artalk-comments",
  pageKey:   "{{ .Permalink }}",
  pageTitle: "{{ .Title }}",
  server:    "//{{ .server }}",
  site:      "{{ .sitename }}",
  darkMode:  isDarkMode,
  locale:    {
    "en": "en",
    "zh-hant-HK": "zh-TW",
    "zh-hant-TW": "zh-TW"
  }[locale],
  emoticons: false,
  placeholder: isEnglish ? "Write something..." : "寫點什麼吧...",
  noComment: isEnglish ? "No comments yet. Start the conversation!" : "就等你來搶頭香！",
  pageVote:  false,
  vote:      false
});
function toggleDarkMode() {
  isDarkMode = !isDarkMode;
  artalk.setDarkMode(isDarkMode);
};
const observer = new MutationObserver((mutations) => {
  mutations.forEach((mutation) => {
    if (mutation.type === "attributes" && mutation.attributeName === "data-scheme") {
      toggleDarkMode();
    };
  });
});
observer.observe(document.documentElement, {
  attributes: true,
  attributeFilter: ["data-scheme"]
});
</script>
{{- end -}}
